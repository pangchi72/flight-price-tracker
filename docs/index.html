<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="機票追蹤">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>機票追蹤</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #18202e; --muted: #5b6578; --line: #edf0f4; --line2: #dfe3ea;
    --accent: #1a5fd0; --accent-soft: rgba(26,95,208,.10); --accent-bg: #e6effc; --accent-text: #1a4fa8;
    --good: #146c2e; --good-bg: #e3f4e8; --bad: #b3261e; --bad-bg: #fdecea; --seg: #eef1f5; --knob-off: #c9d0db;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b1f26; --text: #e8eaee; --muted: #a3abb9; --line: #2a3039; --line2: #353c47;
            --accent: #8ab4f8; --accent-soft: rgba(138,180,248,.14); --accent-bg: #1f2c44; --accent-text: #a8c7fa;
            --good: #81c995; --good-bg: #1d3325; --bad: #f2b8b5; --bad-bg: #3a1f1d; --seg: #262b33; --knob-off: #4a525e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  .app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
  header.top { padding: calc(env(safe-area-inset-top) + 28px) 20px 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  header.top h1 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -.01em; }
  header.bar { padding: calc(env(safe-area-inset-top) + 20px) 8px 8px; display: flex; align-items: center; gap: 4px; }
  header.bar h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .sub { font-size: 13px; color: var(--muted); }
  main { flex: 1; padding: 4px 16px 24px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: 0 1px 2px rgba(20,30,50,.06); }
  .list { background: var(--card); border-radius: 18px; padding: 4px 16px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .sec-title { margin: 6px 4px 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .iconbtn { width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
  .fab { background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .fab { color: #0b1a33; } }
  .btn { height: 50px; border-radius: 14px; border: 0; background: var(--accent); color: #fff; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; cursor: pointer; }
  @media (prefers-color-scheme: dark) { .btn { color: #0b1a33; } }
  .btn.ghost { background: var(--card); color: var(--accent); border: 1px solid var(--line2); }
  .btn.danger { background: var(--card); color: var(--bad); border: 1px solid var(--line2); }
  .btn:disabled { opacity: .5; cursor: default; }
  .small-btn { height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card); color: var(--accent); font-weight: 600; font-size: 14px; cursor: pointer; }
  .badge { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 8px; white-space: nowrap; }
  .b-good { color: var(--good); background: var(--good-bg); } .b-bad { color: var(--bad); background: var(--bad-bg); } .b-mute { color: var(--muted); background: var(--seg); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .banner { background: var(--accent-bg); color: var(--accent-text); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
  .banner.warn { background: var(--bad-bg); color: var(--bad); }
  .route { display: flex; flex-direction: column; gap: 12px; color: var(--text); }
  .codes { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; }
  .price { font-size: 30px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; gap: 8px; }
  .add { border: 1.5px dashed var(--line2); border-radius: 18px; padding: 18px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .stat .k { font-size: 12px; color: var(--muted); } .stat .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; } .stat .v.s { font-size: 17px; font-weight: 600; }
  .seg { display: flex; background: var(--seg); border-radius: 10px; padding: 3px; gap: 2px; }
  .seg button { flex: 1; white-space: nowrap; border: 0; border-radius: 8px; min-height: 34px; padding: 0 12px; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .chart { position: relative; }
  .chart svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .axis { fill: var(--muted); font-size: 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 4px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
  .legend i.band { height: 10px; background: var(--good); opacity: .25; }
  .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -118%); display: none; }
  .fl { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .fl:last-child { border-bottom: 0; }
  .fl b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .sticky { position: sticky; bottom: 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 14px); background: var(--card); border-top: 1px solid var(--line2); }
  nav.tabs { position: sticky; bottom: 0; background: var(--card); border-top: 1px solid var(--line2); padding: 6px 12px calc(env(safe-area-inset-bottom) + 8px); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  nav.tabs a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; color: var(--muted); font-size: 12px; position: relative; }
  nav.tabs a.on { color: var(--accent); font-weight: 600; }
  .dot { position: absolute; top: 4px; left: calc(50% + 8px); width: 8px; height: 8px; border-radius: 4px; background: var(--bad); }
  label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1; min-width: 0; }
  .input { height: 46px; border: 1px solid var(--line2); border-radius: 10px; padding: 0 12px; background: var(--card); color: var(--text); font-size: 16px; width: 100%; }
  .input.big { border: 0; padding: 0; height: 30px; font-weight: 600; font-size: 18px; text-transform: uppercase; }
  .switch { width: 52px; height: 32px; border-radius: 16px; border: 0; padding: 3px; cursor: pointer; display: flex; flex: none; background: var(--knob-off); transition: background .15s; }
  .switch::after { content: ""; width: 26px; height: 26px; border-radius: 13px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--accent); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .stepper { display: flex; align-items: center; gap: 14px; }
  .stepper button { width: 36px; height: 36px; border-radius: 18px; border: 1px solid var(--line2); background: var(--card); font-size: 20px; cursor: pointer; }
  .alert { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); color: var(--text); }
  .alert:last-child { border-bottom: 0; }
  .ic { width: 36px; height: 36px; flex: none; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,.2); }
  .help { font-size: 13px; color: var(--muted); line-height: 1.6; }
  .help ol { margin: 6px 0 0; padding-left: 20px; }
  code { background: var(--seg); padding: 1px 5px; border-radius: 5px; font-size: 12px; }
  .err { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<div class="app" id="app"><main><div class="empty">載入中…</div></main></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
"use strict";
// ---------- 小工具 ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => "NT$" + Math.round(n).toLocaleString("en-US");
const md = (s) => { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const hm = (s) => { const d = new Date(s); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };
const when = (s) => {
  const d = new Date(s), now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const y = new Date(now); y.setDate(now.getDate() - 1);
  return sameDay ? "今天 " + hm(s) : d.toDateString() === y.toDateString() ? "昨天 " + hm(s) : `${md(s)} ${hm(s)}`;
};
const WEEK = "日一二三四五六";
const dateLabel = (iso) => { const [y, m, d] = iso.split("-").map(Number); return `${y}/${m}/${d}（${WEEK[new Date(y, m - 1, d).getDay()]}）`; };
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
let toastTimer;
function toast(msg, ms = 3500) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), ms); }

const I = {
  plus: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  swap: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>',
  back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  edit: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  trend: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l6 6 4-4 8 8"/><path d="M15 17h6v-6"/></svg>',
  warn: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>',
  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  up: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>',
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  ext: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  tPlane: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16l20-8-6 12-3-5-5-1z"/></svg>',
  tBell: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>',
  tGear: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 0 0 0 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>',
};

// ---------- 資料 ----------
let H = { routes: {} }, A = [], loadedAt = 0;
async function loadData() {
  const bust = "?ts=" + Date.now();
  const [h, a] = await Promise.all([
    fetch("data/history.json" + bust).then((r) => (r.ok ? r.json() : { routes: {} })).catch(() => ({ routes: {} })),
    fetch("data/alerts.json" + bust).then((r) => (r.ok ? r.json() : [])).catch(() => []),
  ]);
  H = h || { routes: {} }; H.routes = H.routes || {}; A = Array.isArray(a) ? a : []; loadedAt = Date.now();
  // 清掉已經出現在資料裡的「等待中」航線、已經刪掉的航線
  const pending = store.get("pending", []).filter((p) => !H.routes[p.id] && Date.now() - p.at < 60 * 60e3);
  store.set("pending", pending);
  const deleted = store.get("deleted", []).filter((id) => H.routes[id]);
  store.set("deleted", deleted);
}
function routes() {
  const del = new Set(store.get("deleted", []));
  return Object.entries(H.routes).filter(([id]) => !del.has(id)).map(([id, r]) => {
    const pts = (r.points || []).filter((p) => p.min);
    const last = pts[pts.length - 1], prev = pts[pts.length - 2];
    const low = pts.length ? Math.min(...pts.map((p) => p.min)) : null;
    const ended = r.ended || r.date < todayISO();
    return { id, ...r, pts, last, prev, low, ended };
  });
}
const tripLabel = (r) => (r.trip === "round-trip" ? "來回" : "單程");
const paxLabel = (r) => `${r.adults || 1} 人`;
const seenAlerts = () => store.get("seenAlerts", "");
const unread = () => A.filter((a) => a.t > seenAlerts()).length;

// ---------- GitHub 連線（用來新增／修改航線、立即執行） ----------
function repoInfo() {
  const saved = store.get("repo", "");
  if (saved) return saved;
  const host = location.hostname;
  if (host.endsWith(".github.io")) {
    const owner = host.split(".")[0];
    const name = location.pathname.split("/").filter(Boolean)[0];
    if (name) return `${owner}/${name}`;
  }
  return "";
}
const token = () => store.get("token", "");
async function gh(path, opts = {}) {
  const repo = repoInfo();
  if (!token() || !repo) throw new Error("NO_TOKEN");
  const res = await fetch(`https://api.github.com/repos/${repo}${path}`, {
    ...opts,
    headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token(), "X-GitHub-Api-Version": "2022-11-28", ...(opts.body ? { "Content-Type": "application/json" } : {}) },
  });
  if (!res.ok) {
    let msg = res.status + "";
    try { msg += " " + (await res.json()).message; } catch {}
    throw new Error(msg);
  }
  return res.status === 204 ? null : res.json();
}
const b64dec = (s) => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
const b64enc = (s) => { const bytes = new TextEncoder().encode(s); let bin = ""; bytes.forEach((b) => (bin += String.fromCharCode(b))); return btoa(bin); };
async function editConfig(message, mutate) {
  const file = await gh("/contents/config.json");
  const cfg = JSON.parse(b64dec(file.content));
  mutate(cfg);
  await gh("/contents/config.json", { method: "PUT", body: JSON.stringify({ message, content: b64enc(JSON.stringify(cfg, null, 2) + "\n"), sha: file.sha }) });
  return cfg;
}
const dispatch = (mode) => gh("/actions/workflows/track.yml/dispatches", { method: "POST", body: JSON.stringify({ ref: "main", inputs: { mode } }) });
function needToken(e) {
  if (e && e.message === "NO_TOKEN") { toast("要先在「設定」貼上 GitHub 存取權杖，才能修改航線"); location.hash = "#/settings"; return true; }
  return false;
}

// ---------- 版面 ----------
function tabs(active) {
  const n = unread();
  const t = (href, key, icon, label) => `<a href="${href}" class="${active === key ? "on" : ""}" ${active === key ? 'aria-current="page"' : ""}>${icon}${label}${key === "alerts" && n ? '<span class="dot" aria-label="有新通知"></span>' : ""}</a>`;
  return `<nav class="tabs" aria-label="主要分頁">${t("#/", "home", I.tPlane, "追蹤")}${t("#/alerts", "alerts", I.tBell, "通知")}${t("#/settings", "settings", I.tGear, "設定")}</nav>`;
}
function spark(pts) {
  const p = pts.slice(-28);
  if (p.length < 2) return "";
  const W = 132, Hh = 54, lo = Math.min(...p.map((x) => x.min)), hi = Math.max(...p.map((x) => x.min));
  const y = (v) => (hi === lo ? Hh / 2 : 6 + (1 - (v - lo) / (hi - lo)) * (Hh - 12));
  const x = (i) => 2 + (i / (p.length - 1)) * (W - 6);
  const d = p.map((q, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(q.min).toFixed(1)}`).join(" ");
  const down = p[p.length - 1].min <= p[0].min;
  return `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="近期價格走勢，整體${down ? "下降" : "上升"}"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${x(p.length - 1)}" cy="${y(p[p.length - 1].min)}" r="4" fill="${down ? "var(--good)" : "var(--accent)"}"/></svg>`;
}
function routeCard(r) {
  if (!r.last) {
    return `<a class="card route" href="#/route/${esc(r.id)}"><div class="codes">${esc(r.from)} ${I.arrow} ${esc(r.to)}</div><div class="sub">${dateLabel(r.date)}・${tripLabel(r)}・${paxLabel(r)}</div><div class="sub">${r.error_streak ? "抓取失敗，等下一次重試" : "等待第一次查價…"}</div></a>`;
  }
  const diff = r.prev ? r.last.min - r.prev.min : 0;
  const isLow = r.pts.length > 1 && r.last.min <= r.low;
  let badge = "";
  if (r.ended) badge = '<span class="badge b-mute">已結束</span>';
  else if (r.active === false) badge = '<span class="badge b-mute">已暫停</span>';
  else if (r.error_streak >= 3) badge = '<span class="badge b-bad">抓取失敗</span>';
  else if (isLow) badge = '<span class="badge b-good">歷史新低</span>';

function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const n = raw / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

  }

  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)} ${y(p.min).toFixed(1)}`).join(" ");
  s += `<path d="${line} L${x(pts[pts.length - 1].t)} ${Hh - B} L${x(pts[0].t)} ${Hh - B} Z" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;

  s += `<line id="hl" y1="${T}" y2="${Hh - B}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle id="hd" r="5" fill="var(--accent)" visibility="hidden"/></svg><div class="tip" id="tip"></div>`;

    ${f.err ? `<div class="err" role="alert">${esc(f.err)}</div>` : ""}
    <button class="btn" type="submit" ${f.busy ? "disabled" : ""}>${f.busy ? "送出中…" : editId ? "儲存" : "開始追蹤"}</button>
    ${editId ? `<button class="btn danger" type="button" id="delBtn" ${f.busy ? "disabled" : ""}>刪除這個追蹤</button>` : ""}
  </form></main>`;
}
function afterForm(editId) {
  const fm = $("#rf"), f = form;
  const sync = () => {
    f.from = fm.from.value.trim().toUpperCase(); f.to = fm.to.value.trim().toUpperCase();
    f.date = fm.date.value; if (fm.ret) f.ret = fm.ret.value; f.target = fm.target.value.replace(/[^\d]/g, "");
  };
  fm.addEventListener("input", (e) => {
    sync();
    if (f.err) { f.err = ""; const el = fm.querySelector(".err"); if (el) el.remove(); }
    if (e.target.name === "from") $("#fromName").textContent = f.from.length === 3 ? apName(f.from) : "";
    if (e.target.name === "to") $("#toName").textContent = f.to.length === 3 ? apName(f.to) : "";
  });
  fm.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.sw) { sync(); f[b.dataset.sw] = !f[b.dataset.sw]; render(); }
    else if (b.dataset.trip) { sync(); f.trip = b.dataset.trip; render(); }
    else if (b.dataset.step) { sync(); f.adults = Math.min(9, Math.max(1, f.adults + Number(b.dataset.step))); render(); }
    else if (b.id === "swap") { sync(); [f.from, f.to] = [f.to, f.from]; render(); }
    else if (b.id === "delBtn") removeRoute(editId);
  });
  fm.addEventListener("submit", (e) => { e.preventDefault(); sync(); saveRoute(editId); });
}
async function saveRoute(editId) {
  const f = form;
  const err = !/^[A-Z]{3}$/.test(f.from) || !/^[A-Z]{3}$/.test(f.to) ? "出發地、目的地請填 3 個英文字母的機場代碼"
    : f.from === f.to ? "出發地和目的地不能一樣"
    : !f.date ? "請選擇去程日期" : f.date < todayISO() ? "去程日期已經過了"
    : f.trip === "round-trip" && (!f.ret || f.ret < f.date) ? "請選擇回程日期（要在去程之後）" : "";
  if (err) { f.err = err; render(); return; }
  f.err = ""; f.busy = true; render();
  const id = editId || `${f.from}-${f.to}-${f.date.replace(/-/g, "")}${f.trip === "round-trip" ? "-rt" : ""}`.toLowerCase();
  const [, m, d] = f.date.split("-").map(Number);
  const route = {
    id, name: `${apName(f.from)} → ${apName(f.to)} ${m}/${d}${f.trip === "round-trip" ? " 來回" : ""}`,
    from: f.from, to: f.to, date: f.date, trip: f.trip, return_date: f.trip === "round-trip" ? f.ret : null,
    adults: f.adults, seat: "economy", max_stops: f.nonstop ? 0 : null, active: f.active,
    alerts: { notify_new_low: f.low, new_low_min_diff: 100, notify_drop: f.drop, drop_pct: 3, drop_abs: 200, target_price: f.target ? Number(f.target) : null, notify_rise_pct: f.rise ? 10 : null },
  };
  try {
    await editConfig(editId ? `修改追蹤：${route.name}` : `新增追蹤：${route.name}`, (cfg) => {
      const i = cfg.routes.findIndex((r) => r.id === id);
      if (!editId && i >= 0) throw new Error("這個航線和日期已經在追蹤了");
      if (i >= 0) cfg.routes[i] = { ...cfg.routes[i], ...route }; else cfg.routes.push(route);
    });
    if (!editId) store.set("pending", [...store.get("pending", []), { id, from: f.from, to: f.to, date: f.date, at: Date.now() }]);
    form = null;
    toast(editId ? "已儲存，下次查價會套用新設定" : "已加入！約 2–5 分鐘後會查到第一筆價格", 5000);
    location.hash = editId ? "#/route/" + id : "#/";
  } catch (e) {
    f.busy = false;
    if (!needToken(e)) { f.err = "送出失敗：" + e.message; render(); }
  }
}
async function removeRoute(id) {
  if (!confirm("確定要刪除這個追蹤？價格紀錄也會一起刪掉。")) return;
  form.busy = true; render();
  try {
    await editConfig(`刪除追蹤：${id}`, (cfg) => { cfg.routes = cfg.routes.filter((r) => r.id !== id); });
    store.set("deleted", [...store.get("deleted", []), id]);
    form = null; toast("已刪除"); location.hash = "#/";
  } catch (e) { form.busy = false; if (!needToken(e)) { form.err = "刪除失敗：" + e.message; render(); } }
}

// ---------- 畫面 4：通知紀錄 ----------
const KIND = {
  new_low: ["b-good", I.down], drop: ["b-good", I.down], target: ["b-good", I.check], rise: ["b-bad", I.up],
  error: ["b-bad", I.warn], recovered: ["b-mute", I.check], start: ["b-mute", I.bell], test: ["b-mute", I.bell],
};
function viewAlerts() {
  const seen = seenAlerts();
  const items = A.map((a) => {
    const [cls, icon] = KIND[a.kind] || ["b-mute", I.bell];
    const title = (a.title || "").split("｜").pop();
    const body = (a.message || "").split("\n")[0];
    const inner = `<span class="ic ${cls}">${icon}</span><span style="flex:1;display:flex;flex-direction:column;gap:2px;min-width:0">
      <span style="display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600"><span>${esc(title)}${a.t > seen ? ' <span class="badge b-bad" style="padding:1px 6px">新</span>' : ""}</span><span class="sub" style="font-weight:400;font-size:12px;white-space:nowrap">${when(a.t)}</span></span>
      <span class="sub">${a.route_name ? esc(a.route_name) + "・" : ""}${esc(body)}</span></span>`;
    return a.route_id && H.routes[a.route_id] ? `<a class="alert" href="#/route/${esc(a.route_id)}">${inner}</a>` : `<div class="alert">${inner}</div>`;
  }).join("");
  if (A[0]) store.set("seenAlerts", A[0].t);
  return `<header class="top"><h1>通知</h1></header><main>${items ? `<section class="list" style="padding:4px 14px">${items}</section>` : '<div class="empty">還沒有任何通知。</div>'}</main>${tabs("alerts")}`;
}

// ---------- 畫面 5：設定 ----------
function viewSettings() {
  const ch = (H.status && H.status.channels) || {};
  const repo = repoInfo(), hasToken = !!token();
  return `<header class="top"><h1>設定</h1></header><main>
    <h2 class="sec-title">通知管道</h2>
    <section class="list">
      <div class="row"><div style="display:flex;flex-direction:column"><span>ntfy 推播</span><span class="sub" style="font-size:12px">${ch.ntfy ? "主題：" + esc(ch.ntfy_topic_hint) : "在 GitHub Secrets 設定 NTFY_TOPIC"}</span></div><span class="badge ${ch.ntfy ? "b-good" : "b-mute"}">${ch.ntfy ? "已設定" : "未設定"}</span></div>
      <div class="row"><div style="display:flex;flex-direction:column"><span>Google 價格分析（SerpApi）</span><span class="sub" style="font-size:12px">歷史價格、一般區間，每條航線每天查 1 次</span></div><span class="badge ${ch.serpapi ? "b-good" : "b-mute"}">${ch.serpapi ? "已設定" : "未設定"}</span></div>
      <div class="row"><div style="display:flex;flex-direction:column"><span>Telegram</span><span class="sub" style="font-size:12px">選用，可以和 ntfy 同時開</span></div><span class="badge ${ch.telegram ? "b-good" : "b-mute"}">${ch.telegram ? "已設定" : "未設定"}</span></div>
    </section>
    <div class="help">通知管道的金鑰放在 GitHub 專案的 Settings → Secrets and variables → Actions${repo ? `（<a href="https://github.com/${esc(repo)}/settings/secrets/actions" target="_blank" rel="noopener">直接打開</a>）` : ""}，狀態會在下一次執行後更新。</div>
    <button class="btn ghost" type="button" id="testBtn">傳送測試通知到手機</button>
    <button class="btn ghost" type="button" id="runBtn">立即查一次價格</button>

    <h2 class="sec-title">GitHub 連線（新增、修改航線時需要）</h2>
    <section class="list" style="padding:12px 16px;display:flex;flex-direction:column;gap:12px">
      <label class="field">專案<input class="input" id="repoIn" placeholder="帳號/flight-price-tracker" value="${esc(repo)}" autocomplete="off"></label>
      <label class="field">存取權杖（只存在這支手機的瀏覽器裡）<input class="input" id="tokIn" type="password" placeholder="${hasToken ? "已儲存（重新貼上可更換）" : "github_pat_…"}" autocomplete="off"></label>
      <div style="display:flex;gap:10px"><button class="small-btn" type="button" id="saveTok">儲存並測試</button>${hasToken ? '<button class="small-btn" type="button" id="clearTok" style="color:var(--bad)">移除權杖</button>' : ""}</div>
      <div id="tokMsg" class="sub" aria-live="polite">${hasToken ? "權杖已儲存。" : ""}</div>
      <details class="help"><summary>怎麼產生權杖？</summary><ol>
        <li>打開 <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub → Fine-grained token</a></li>
        <li>Expiration 選 90 天或更久；Repository access 選 <b>Only select repositories</b> → 選 <code>flight-price-tracker</code></li>
        <li>Permissions → Repository permissions：<b>Contents</b> 和 <b>Actions</b> 都設為 <b>Read and write</b></li>
        <li>按 Generate token，複製後貼到上面</li></ol></details>
    </section>

    <h2 class="sec-title">檢查設定</h2>
    <section class="list">
      <div class="row"><span>檢查頻率</span><span class="sub" style="font-size:15px">${esc(H.status?.interval || "每 6 小時")}</span></div>
      <div class="row"><span>資料來源</span><span class="sub" style="font-size:15px">${esc(H.status?.source || "Google Flights")}</span></div>
      <div class="row"><span>上次更新</span><span class="sub" style="font-size:15px">${H.updated ? when(H.updated) : "—"}</span></div>
      ${repo ? `<a class="row" href="https://github.com/${esc(repo)}/actions" target="_blank" rel="noopener"><span>查看執行紀錄（GitHub Actions）</span>${I.ext}</a>` : ""}
    </section>
  </main>${tabs("settings")}`;
}
function afterSettings() {
  const run = async (btn, mode, ok) => {
    btn.disabled = true;
    try { await dispatch(mode); toast(ok, 5000); } catch (e) { if (!needToken(e)) toast("失敗：" + e.message); }
    btn.disabled = false;
  };
  $("#testBtn").onclick = (e) => run(e.currentTarget, "test", "已送出，約 1 分鐘內手機會收到測試通知");
  $("#runBtn").onclick = (e) => run(e.currentTarget, "track", "已開始查價，約 2–5 分鐘後重新整理就會看到");
  $("#saveTok").onclick = async () => {
    const repo = $("#repoIn").value.trim(), tok = $("#tokIn").value.trim();
    if (repo) store.set("repo", repo);
    if (tok) store.set("token", tok);
    const msg = $("#tokMsg");
    if (!token()) { msg.textContent = "請先貼上權杖。"; return; }
    msg.textContent = "測試中…";
    try { const r = await gh(""); msg.innerHTML = `<span class="good">連線成功：${esc(r.full_name)}</span>`; $("#tokIn").value = ""; }
    catch (e) { msg.innerHTML = `<span class="bad">連線失敗（${esc(e.message)}），請確認專案名稱和權杖權限。</span>`; }
  };
  const c = $("#clearTok"); if (c) c.onclick = () => { store.del("token"); render(); toast("已移除權杖"); };
}

// ---------- 路由 ----------
function render() {
  const h = location.hash || "#/";
  const app = $("#app");
  let m;
  if ((m = h.match(/^#\/route\/(.+)$/))) { app.innerHTML = viewRoute(decodeURIComponent(m[1])); afterRoute(decodeURIComponent(m[1])); }
  else if (h === "#/add") { app.innerHTML = viewForm(null); afterForm(null); }
  else if ((m = h.match(/^#\/edit\/(.+)$/))) { const id = decodeURIComponent(m[1]); app.innerHTML = viewForm(id); afterForm(id); }
  else if (h === "#/alerts") app.innerHTML = viewAlerts();
  else if (h === "#/settings") { app.innerHTML = viewSettings(); afterSettings(); }
  else app.innerHTML = viewHome();
}
let lastHash = "";
window.addEventListener("hashchange", () => { if (!location.hash.match(/^#\/(add|edit)/)) form = null; if (location.hash !== lastHash) window.scrollTo(0, 0); lastHash = location.hash; render(); });
let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { if (location.hash.startsWith("#/route/")) render(); }, 200); });
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && Date.now() - loadedAt > 60e3 && !location.hash.match(/^#\/(add|edit)/)) { await loadData(); render(); }
});
loadData().then(render);
</script>
</body>
